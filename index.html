<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="xBl0g — fast, simple, minimal nerd blog. Static, no build step, no backend.">
  <title>xBl0g</title>

  <link rel="icon" href="image/gray.ico">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="vendor/highlight-monokai-sublime.css">

  <!-- highlight.js exposes a global `hljs`; the ES modules call it after render. -->
  <script src="vendor/highlight.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="loading">
  <div id="loader" class="loader" aria-hidden="true"></div>

  <header id="site-header">
    <h1 id="site-title"></h1>
    <p id="subtitle"></p>
  </header>

  <nav id="topbar" aria-label="Main">
    <ul id="menu"></ul>
  </nav>

  <main id="content" class="prose"></main>

  <footer id="footer">
    <span id="footer-meta"></span>
    <span id="footer-right">
      <span id="theme-switch"></span>
      <span id="social"></span>
    </span>
  </footer>
</body>
</html>
